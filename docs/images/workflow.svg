<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<title id="title">压缩摘要与长期记忆</title><desc id="desc">每条消息提交时收录为原话证据，会话空闲时整理成记忆网络。DSH 压缩只把旧消息换成摘要，原话仍在记忆库中；模型需要时通过 suzu_memory_search 检索相关记忆。</desc>
<style>
:root{--bg:#faf8fe;--bg2:#f0f2ff;--panel:#ffffff;--soft:#f1eaf9;--line:#e5dcef;--text:#30233f;--muted:#897899;--accent:#9365cb;--pink:#bf71ac;--blue:#777bc4;--edge:#c2a8db;--dsh:#4d6bfe;--dshsoft:#e9edff;--dshline:#cdd6ff;--dshedge:#9fb0fb}
@media(prefers-color-scheme:dark){:root{--bg:#120e1c;--bg2:#0e1226;--panel:#1d162b;--soft:#2c203e;--line:#3a2b4d;--text:#f1eafa;--muted:#b5a0ca;--accent:#c39cf5;--pink:#e0a1ce;--blue:#a5acf1;--edge:#795496;--dsh:#8fa2ff;--dshsoft:#1a2044;--dshline:#2b3570;--dshedge:#4f5fb8}}
.bg{fill:var(--bg);stroke:var(--line)}.panel{fill:var(--panel);stroke:var(--line)}.soft{fill:var(--soft)}
.text{fill:var(--text)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.pink{fill:var(--pink)}.blue{fill:var(--blue)}
.dsh{fill:var(--dsh)}.dshsoft{fill:var(--dshsoft)}.dshpanel{fill:var(--dshsoft);stroke:var(--dshline)}
.edge{fill:none;stroke:var(--edge);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dshedge{fill:none;stroke:var(--dshedge);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dot{fill:none;stroke:var(--edge);stroke-width:1.4;stroke-dasharray:2 5;stroke-linecap:round}
.ghost{fill:none;stroke:var(--edge);stroke-width:1.4;stroke-dasharray:4 4}
.bar{fill:var(--line)}.dshbar{fill:var(--dshline)}
.g1{stop-color:var(--bg)}.g2{stop-color:var(--bg2)}
.t1{stop-color:var(--accent)}.t2{stop-color:var(--pink)}
</style>
<defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="g1"/><stop offset="1" class="g2"/></linearGradient>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" class="t1"/><stop offset="1" class="t2"/></linearGradient></defs>
<rect x="1" y="1" width="1118" height="638" rx="22" class="bg"/><text x="36" y="36" font-size="12" class="muted" font-weight="600" letter-spacing="2.2">HOW IT WORKS / CONTEXT &amp; MEMORY</text><text x="36" y="77" font-size="32" class="text" font-weight="600">压缩只缩短上下文，原话都在记忆里。</text><text x="36" y="108" font-size="17" class="muted" font-weight="400">每条消息提交时收录，会话空闲时整理，模型需要时自己检索。</text><rect x="36" y="140" width="1048" height="150" rx="18" class="dshpanel"/><text x="60" y="206" font-size="19" class="text" font-weight="600">模型上下文</text><text x="60" y="232" font-size="14" class="muted" font-weight="400">DSH 会话</text><rect x="36" y="352" width="1048" height="178" rx="18" class="soft"/><text x="60" y="432" font-size="19" class="text" font-weight="600">长期记忆</text><text x="60" y="458" font-size="14" class="muted" font-weight="400">Suzu Memory</text><rect x="172" y="372" width="674" height="138" rx="14" class="panel"/><text x="192" y="456" font-size="11" class="accent" font-weight="600">RAW EVIDENCE</text><text x="192" y="484" font-size="20" class="text" font-weight="600">原话证据</text><text x="284" y="484" font-size="14" class="muted" font-weight="400">每条消息一条记录，压缩后仍然可查</text><rect x="884" y="372" width="176" height="138" rx="14" class="panel"/><text x="904" y="456" font-size="11" class="accent" font-weight="600">MEMORY</text><text x="904" y="484" font-size="20" class="text" font-weight="600">记忆网络</text><path d="M221 241V384" class="dot"/><rect x="199" y="390" width="44" height="22" rx="8" class="dshsoft"/><rect x="208" y="398" width="26" height="6" rx="3" class="dshbar"/><path d="M293 241V384" class="dot"/><rect x="271" y="390" width="44" height="22" rx="8" class="soft"/><rect x="280" y="398" width="26" height="6" rx="3" class="bar"/><path d="M365 241V384" class="dot"/><rect x="343" y="390" width="44" height="22" rx="8" class="dshsoft"/><rect x="352" y="398" width="26" height="6" rx="3" class="dshbar"/><path d="M637 241V384" class="dot"/><rect x="615" y="390" width="44" height="22" rx="8" class="dshsoft"/><rect x="624" y="398" width="26" height="6" rx="3" class="dshbar"/><path d="M709 241V384" class="dot"/><rect x="687" y="390" width="44" height="22" rx="8" class="soft"/><rect x="696" y="398" width="26" height="6" rx="3" class="bar"/><path d="M781 241V384" class="dot"/><rect x="759" y="390" width="44" height="22" rx="8" class="dshsoft"/><rect x="768" y="398" width="26" height="6" rx="3" class="dshbar"/><text x="508" y="406" font-size="14" class="muted" font-weight="400" text-anchor="middle">摘要不重复收录</text><rect x="190" y="193" width="62" height="44" rx="12" class="ghost"/><rect x="262" y="193" width="62" height="44" rx="12" class="ghost"/><rect x="334" y="193" width="62" height="44" rx="12" class="ghost"/><path d="M404 215H430m-5 -5 5 5-5 5" class="edge"/><text x="417" y="206" font-size="13" class="accent" font-weight="600" text-anchor="middle">压缩</text><rect x="438" y="180" width="140" height="70" rx="14" class="soft"/><text x="456" y="211" font-size="18" class="text" font-weight="600">压缩摘要</text><text x="456" y="234" font-size="14" class="muted" font-weight="400">本会话提示词</text><rect x="606" y="193" width="62" height="44" rx="14" class="dshpanel"/><rect x="620" y="206" width="29" height="6" rx="3" class="dshbar"/><rect x="620" y="218" width="17" height="6" rx="3" class="dshbar"/><rect x="678" y="193" width="62" height="44" rx="14" class="panel"/><rect x="692" y="206" width="29" height="6" rx="3" class="bar"/><rect x="692" y="218" width="17" height="6" rx="3" class="bar"/><rect x="750" y="193" width="62" height="44" rx="14" class="dshpanel"/><rect x="764" y="206" width="29" height="6" rx="3" class="dshbar"/><rect x="764" y="218" width="17" height="6" rx="3" class="dshbar"/><path d="M820 215H876m-5 -5 5 5-5 5" class="dshedge"/><rect x="884" y="176" width="176" height="78" rx="16" class="panel"/><text x="904" y="210" font-size="20" class="text" font-weight="600">聊天模型</text><text x="904" y="234" font-size="14" class="muted" font-weight="400">读取上下文并回复</text><rect x="52" y="305" width="122" height="32" rx="16" class="panel"/><path d="M74 314v14m-4.5 -4.5 4.5 4.5 4.5-4.5" class="edge"/><text x="88" y="326" font-size="14" class="muted" font-weight="600">提交时收录</text><path d="M948 260V364m-5 -5 5 5 5-5" class="edge"/><path d="M986 366V262m-5 5 5-5 5 5" class="edge"/><text x="936" y="316" font-size="13" class="accent" font-weight="600" text-anchor="end" font-family="Cascadia Code, SFMono-Regular, Consolas, Menlo, monospace">suzu_memory_search</text><text x="936" y="336" font-size="14" class="muted" font-weight="400" text-anchor="end">按需检索</text><text x="998" y="336" font-size="14" class="muted" font-weight="400">相关记忆</text><path d="M852 445H876m-5 -5 5 5-5 5" class="edge"/><text x="865" y="433" font-size="13" class="accent" font-weight="600" text-anchor="middle">整理</text><circle cx="996" cy="416" r="8.84" class="soft"/><path d="M980.36 395.6L999.4 383.36" class="edge"/><path d="M999.4 383.36L1015.72 399" class="edge"/><path d="M980.36 395.6L996 416" class="edge"/><path d="M1015.72 399L996 416" class="edge"/><path d="M996 416L976.96 426.2" class="edge"/><path d="M996 416L1012.32 431.64" class="edge"/><path d="M976.96 426.2L993.28 445.24" class="edge"/><path d="M1015.72 399L1028.64 413.28" class="edge"/><path d="M1012.32 431.64L1028.64 413.28" class="edge"/><path d="M980.36 395.6L976.96 426.2" class="edge"/><circle cx="980.36" cy="395.6" r="2.04" class="accent"/><circle cx="999.4" cy="383.36" r="1.36" class="blue"/><circle cx="1015.72" cy="399" r="2.3800000000000003" class="pink"/><circle cx="996" cy="416" r="3.74" class="accent"/><circle cx="976.96" cy="426.2" r="1.7000000000000002" class="blue"/><circle cx="1012.32" cy="431.64" r="2.04" class="accent"/><circle cx="993.28" cy="445.24" r="1.36" class="pink"/><circle cx="1028.64" cy="413.28" r="1.36" class="blue"/><rect x="36" y="552" width="1048" height="52" rx="12" class="soft"/><text x="56" y="584" font-size="15" class="accent" font-weight="600">压缩</text><text x="100" y="584" font-size="15" class="muted" font-weight="400">由 DSH 触发，插件只替换压缩指令</text><text x="426" y="584" font-size="15" class="accent" font-weight="600">整理</text><text x="470" y="584" font-size="15" class="muted" font-weight="400">会话空闲时自动进行，也可手动</text><text x="782" y="584" font-size="15" class="accent" font-weight="600">Embedding</text><text x="874" y="584" font-size="15" class="muted" font-weight="400">可选，增加向量召回</text>
</svg>
