<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<title id="title">DSH Suzu Memory</title><desc id="desc">让 DeepSeek Harness 的会话，记得你们聊过的事。为 DeepSeek Harness 接入 Suzu Memory 长期记忆。</desc>
<style>
:root{--bg:#faf8fe;--bg2:#f0f2ff;--panel:#ffffff;--soft:#f1eaf9;--line:#e5dcef;--text:#30233f;--muted:#897899;--accent:#9365cb;--pink:#bf71ac;--blue:#777bc4;--edge:#c2a8db;--dsh:#4d6bfe;--dshsoft:#e9edff;--dshline:#cdd6ff;--dshedge:#9fb0fb}
